name: Deploy to GitHub Pages

on:
  push:
    branches: ["master", "main"]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Build Portal
        working-directory: ./portal
        run: |
          npm ci
          npm run build

      - name: Build Videos Project
        working-directory: ./videos_project
        run: |
          npm ci
          npm run build

      - name: Prepare dist folder
        run: |
          # Create a root distribution folder
          mkdir -p dist_final
          
          # Copy portal to root
          cp -R portal/dist/* dist_final/
          
          # Copy videos project to a subdirectory
          mkdir -p dist_final/videos_project
          cp -R videos_project/dist/* dist_final/videos_project/
          
          # Add CNAME
          echo "highsnr.org" > dist_final/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist_final'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
