name: Deploy standalone tools

on:
  push:
    branches: ["master", "main"]
  workflow_dispatch:

env:
  ADC_SITE_REPOSITORY: ${{ vars.ADC_SITE_REPOSITORY }}
  FILTERS_SITE_REPOSITORY: ${{ vars.FILTERS_SITE_REPOSITORY }}

jobs:
  deploy-adc:
    name: Deploy ADC tool
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deploy token
        env:
          PAGES_DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          if [ -z "$PAGES_DEPLOY_TOKEN" ]; then
            echo "::error::Create repository secret PAGES_DEPLOY_TOKEN with repo/admin permissions, then rerun this workflow."
            exit 1
          fi
          if [ -z "$ADC_SITE_REPOSITORY" ]; then
            echo "::error::Create repository variable ADC_SITE_REPOSITORY, for example DrBorisKuznetsov/<existing-adc-pages-repo>."
            exit 1
          fi

      - name: Prepare ADC site
        run: |
          rm -rf dist_adc
          mkdir -p dist_adc
          cp -R adc_tool/index.html dist_adc/
          cp -R adc_tool/index.css dist_adc/
          cp -R adc_tool/assets dist_adc/
          cp -R adc_tool/src dist_adc/
          cp -R adc_tool/vendor dist_adc/
          cp -R adc_tool/CNAME dist_adc/
          touch dist_adc/.nojekyll

      - name: Ensure ADC repository exists
        env:
          GH_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          gh repo view "$ADC_SITE_REPOSITORY" >/dev/null 2>&1 || \
            gh repo create "$ADC_SITE_REPOSITORY" --public --description "HighSNR ADC Input Stage Simulator"

      - name: Publish ADC site
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          external_repository: ${{ env.ADC_SITE_REPOSITORY }}
          publish_branch: gh-pages
          publish_dir: ./dist_adc
          force_orphan: true
          cname: adc.highsnr.org

      - name: Configure ADC GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          gh api --method POST "repos/$ADC_SITE_REPOSITORY/pages" \
            -f "source[branch]=gh-pages" \
            -f "source[path]=/" >/dev/null 2>&1 || true
          gh api --method PUT "repos/$ADC_SITE_REPOSITORY/pages" \
            -f cname="adc.highsnr.org" \
            -f "source[branch]=gh-pages" \
            -f "source[path]=/"

  deploy-filters:
    name: Deploy filters tool
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deploy token
        env:
          PAGES_DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          if [ -z "$PAGES_DEPLOY_TOKEN" ]; then
            echo "::error::Create repository secret PAGES_DEPLOY_TOKEN with repo/admin permissions, then rerun this workflow."
            exit 1
          fi
          if [ -z "$FILTERS_SITE_REPOSITORY" ]; then
            echo "::error::Create repository variable FILTERS_SITE_REPOSITORY, for example DrBorisKuznetsov/filters.highsnr.org."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: capacitor_filter_tool/package-lock.json

      - name: Build filters tool
        working-directory: ./capacitor_filter_tool
        run: |
          npm ci
          npm run build
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Ensure filters repository exists
        env:
          GH_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          gh repo view "$FILTERS_SITE_REPOSITORY" >/dev/null 2>&1 || \
            gh repo create "$FILTERS_SITE_REPOSITORY" --public --description "HighSNR Passive Filter Distortion Analyzer"

      - name: Publish filters site
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          external_repository: ${{ env.FILTERS_SITE_REPOSITORY }}
          publish_branch: gh-pages
          publish_dir: ./capacitor_filter_tool/dist
          force_orphan: true
          cname: filters.highsnr.org

      - name: Configure filters GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          gh api --method POST "repos/$FILTERS_SITE_REPOSITORY/pages" \
            -f "source[branch]=gh-pages" \
            -f "source[path]=/" >/dev/null 2>&1 || true
          gh api --method PUT "repos/$FILTERS_SITE_REPOSITORY/pages" \
            -f cname="filters.highsnr.org" \
            -f "source[branch]=gh-pages" \
            -f "source[path]=/"
